<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暖金双人近吻三镜 · 拆解报告</title>
<style>
/* Case Lab report — editing-bay aesthetic. Single file, no external fonts. */

:root {
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Iowan Old Style", Georgia, serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;

  --fn-hook: #ff6b4a;
  --fn-setup: #7a8aa0;
  --fn-build: #f0b429;
  --fn-twist: #b08cff;
  --fn-payoff: #4fd18b;
  --fn-ending: #8c8577;

  --radius: 10px;
  --radius-sm: 6px;
  --maxw: 1320px;
}

[data-theme="dark"] {
  --bg: #12110f;
  --bg-2: #1a1916;
  --panel: #1f1d1a;
  --panel-2: #26241f;
  --line: #34312b;
  --line-2: #45413a;
  --ink: #ece6da;
  --ink-2: #b9b2a4;
  --ink-3: #847d70;
  --accent: #ffb547;
  --accent-ink: #1a1408;
  --accent-soft: rgba(255, 181, 71, .14);
  --good: #4fd18b;
  --warn: #ffb547;
  --bad: #ff6b4a;
  --skip: #847d70;
  --track-motion: #6fd3c4;
  --track-audio: #e58fb5;
  --track-bright: #d9cfb8;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f4f0e8;
  --bg-2: #ece6db;
  --panel: #fbf9f4;
  --panel-2: #f3eee4;
  --line: #ddd5c6;
  --line-2: #c9bfad;
  --ink: #1d1b17;
  --ink-2: #4f4a40;
  --ink-3: #8a8274;
  --accent: #c2410c;
  --accent-ink: #fff;
  --accent-soft: rgba(194, 65, 12, .1);
  --good: #15803d;
  --warn: #b45309;
  --bad: #c2410c;
  --skip: #8a8274;
  --track-motion: #0f766e;
  --track-audio: #be185d;
  --track-bright: #6b6252;
  --shadow: 0 10px 30px -20px rgba(60, 40, 10, .35);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.tc, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-3); }
.spacer { flex: 1; }

.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.brand-mark { color: var(--accent); font-size: 18px; }
.toc { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.toc::-webkit-scrollbar { display: none; }
.toc a {
  padding: 5px 10px; border-radius: 999px; color: var(--ink-3); text-decoration: none; white-space: nowrap; font-size: 13px;
  transition: color .15s, background .15s;
}
.toc a:hover { color: var(--ink); }
.toc a.on { color: var(--accent); background: var(--accent-soft); }
.top-actions { display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-2);
  background: var(--panel-2); font-size: 13px; white-space: nowrap;
  transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line-2); }
.btn.icon { width: 32px; height: 32px; padding: 0; justify-content: center; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.check-pill {
  font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-2);
  color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.check-pill b { font-weight: 600; }
.check-pill .ok { color: var(--good); }
.check-pill .w { color: var(--warn); }
.check-pill .f { color: var(--bad); }

/* ---------- page ---------- */
.page { max-width: var(--maxw); margin: 0 auto; padding: 0 24px 80px; }

.hero {
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px;
  padding: 48px 0 36px; border-bottom: 1px solid var(--line);
  animation: rise .6s ease both;
}
.hero-kicker { font: 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
.hero h1 {
  font: 600 clamp(28px, 3.6vw, 44px)/1.18 var(--serif); margin: 14px 0 18px; letter-spacing: .01em;
  text-wrap: balance;
}
.hero .quote {
  font: 400 18px/1.75 var(--serif); color: var(--ink); margin: 0 0 18px;
  padding-left: 16px; border-left: 3px solid var(--accent);
}
.hero .meta-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); background: var(--panel);
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.accent { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.hero-side { display: flex; flex-direction: column; gap: 16px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--panel); padding: 14px 14px 12px; }
.stat .k { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
.stat .v { font: 600 22px/1.3 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }
.stat .h { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.hero-note { font-size: 13px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.hero-note b { color: var(--ink); }

/* ---------- blocks ---------- */
.block { padding: 44px 0 8px; animation: rise .6s ease both; }
.block-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.block-head h2 { font: 600 24px/1.2 var(--serif); margin: 0; display: flex; align-items: baseline; gap: 12px; }
.block-head .idx { font: 500 12px/1 var(--mono); color: var(--accent); letter-spacing: .1em; }
.block-head .sub { margin: 0; color: var(--ink-3); font-size: 13px; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ---------- monitor ---------- */
.monitor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 16px; }
.monitor.portrait { grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); }
.player-wrap {
  position: relative; background: #000; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
  display: flex; flex-direction: column;
}
.player-wrap video { width: 100%; flex: 1; min-height: 0; background: #000; max-height: 72vh; object-fit: contain; }
.player-empty {
  position: absolute; inset: 0 0 48px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: #b9b2a4; background: repeating-linear-gradient(135deg, #15140f 0 12px, #1a1913 12px 24px);
}
.player-wrap.empty .player-empty { display: flex; }
.player-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #0d0c0a; border-top: 1px solid #2a2823; color: #ece6da;
}
.player-bar .btn { background: #1f1d1a; border-color: #3a372f; color: #ece6da; }
.player-bar .btn.on { background: var(--accent); color: var(--accent-ink); }
.player-bar select { background: #1f1d1a; border: 1px solid #3a372f; border-radius: 6px; padding: 4px 6px; color: #ece6da; }
.player-bar .tc { font-size: 13px; }

.inspector { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.insp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.insp-id { font: 600 26px/1 var(--mono); }
.insp-time { font: 12px var(--mono); color: var(--ink-3); }
.insp-event { font: 500 16px/1.6 var(--serif); margin: 0; }
.insp-dl { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; margin: 0; font-size: 13px; }
.insp-dl dt { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.insp-dl dd { margin: 0; color: var(--ink-2); }
.insp-nav { display: flex; gap: 6px; margin-top: auto; }
.insp-nav .btn { flex: 1; justify-content: center; }
.insp-progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.insp-progress i { display: block; height: 100%; background: var(--accent); width: 0; }

.fn {
  display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 4px; color: #111; background: var(--c, var(--fn-setup));
}
.fn[data-fn="hook"] { --c: var(--fn-hook); }
.fn[data-fn="setup"] { --c: var(--fn-setup); }
.fn[data-fn="build"] { --c: var(--fn-build); }
.fn[data-fn="twist"] { --c: var(--fn-twist); }
.fn[data-fn="payoff"] { --c: var(--fn-payoff); }
.fn[data-fn="ending"] { --c: var(--fn-ending); }
.att { display: inline-flex; gap: 2px; vertical-align: middle; }
.att i { width: 6px; height: 10px; border-radius: 1px; background: var(--line-2); }
.att i.on { background: var(--accent); }

.verdict { font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.verdict.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.verdict.hint { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.verdict.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }

/* ---------- tracks ---------- */
.tracks { position: relative; margin-top: 16px; padding: 14px 16px 10px; }
.tracks-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.tracks-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tracks-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tracks-canvas { position: relative; user-select: none; cursor: crosshair; touch-action: none; }
.tracks-canvas svg { display: block; width: 100%; overflow: visible; }
.tracks-canvas .lbl { font: 11px var(--sans); fill: var(--ink-3); }
.tracks-canvas .axis { font: 10px var(--mono); fill: var(--ink-3); }
.tracks-canvas .grid { stroke: var(--line); stroke-width: 1; }
.tracks-canvas .lane { fill: var(--bg-2); }
.tracks-canvas .shot { fill: var(--panel-2); stroke: var(--line-2); }
.tracks-canvas .shot.alt { fill: color-mix(in srgb, var(--panel-2) 60%, var(--line-2)); }
.tracks-canvas .shot.on { fill: var(--accent-soft); stroke: var(--accent); }
.tracks-canvas .beat { opacity: .82; transition: opacity .12s; }
.tracks-canvas .beat.on { opacity: 1; stroke: var(--ink); stroke-width: 1.5; }
.tracks-canvas .beat-t { font: 600 10px var(--mono); fill: #111; pointer-events: none; }
.tracks-canvas .curve-motion { fill: color-mix(in srgb, var(--track-motion) 28%, transparent); stroke: var(--track-motion); stroke-width: 1.2; }
.tracks-canvas .curve-audio { fill: color-mix(in srgb, var(--track-audio) 26%, transparent); stroke: var(--track-audio); stroke-width: 1.2; }
.tracks-canvas .curve-bright { fill: none; stroke: var(--track-bright); stroke-width: 1.2; stroke-dasharray: 3 2; }
.tracks-canvas .curve-att { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 1.6; }
.tracks-canvas .onset { stroke: var(--track-audio); stroke-width: 1; opacity: .75; }
.tracks-canvas .cut { stroke: var(--ink); stroke-width: 1; opacity: .55; }
.tracks-canvas .cut.sync { stroke: var(--good); opacity: 1; stroke-width: 2; }
.tracks-canvas .peak { fill: var(--accent); cursor: pointer; }
.tracks-canvas .playhead { stroke: var(--accent); stroke-width: 2; }
.tracks-canvas .hoverline { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.tracks-canvas .loop { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 4 3; }

.scrub-tip {
  position: absolute; z-index: 5; pointer-events: none; width: 188px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .6);
  font-size: 12px;
}
.scrub-tip img { width: 100%; border-radius: 4px; margin-bottom: 6px; background: #000; max-height: 200px; object-fit: contain; }
.scrub-tip .row { display: flex; justify-content: space-between; color: var(--ink-3); }
.scrub-tip .row b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.scrub-tip .tt { font: 600 13px var(--mono); margin-bottom: 4px; }

/* ---------- beats ---------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; font-size: 12px; color: var(--ink-2);
}
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips button .n { font-family: var(--mono); opacity: .6; margin-left: 4px; }
.search {
  width: 260px; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--panel);
}
.search:focus { outline: none; border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--ink-3); }
.seg button.on { background: var(--panel-2); color: var(--ink); }

.beats.list .beat-row {
  display: grid; grid-template-columns: 196px 128px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative;
  transition: background .12s;
}
.beats.list .beat-row:hover { background: var(--panel); }
.beats.list .beat-row.on { background: var(--accent-soft); }
.beats.list .beat-row.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.beats.list .beat-row:first-child { border-top: 1px solid var(--line); }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-self: start; }
.thumbs.portrait { grid-template-columns: 1fr 1fr; max-width: 140px; }
.thumbs figure { margin: 0; position: relative; border-radius: 4px; overflow: hidden; background: #000; cursor: zoom-in; aspect-ratio: var(--ar, 16/9); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; }
.thumbs figure:hover img { transform: scale(1.05); }
.thumbs figcaption { position: absolute; left: 3px; bottom: 3px; font: 600 9px var(--mono); color: #fff; background: rgba(0, 0, 0, .6); padding: 1px 4px; border-radius: 2px; }
.thumbs .none { aspect-ratio: var(--ar, 16/9); border: 1px dashed var(--line-2); border-radius: 4px; display: grid; place-items: center; font-size: 10px; color: var(--ink-3); }
.beat-meta { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.beat-meta .bid { font: 600 16px var(--mono); }
.beat-meta .bt { font: 12px var(--mono); color: var(--ink-3); }
.beat-main .ev { font: 500 14.5px/1.6 var(--serif); margin: 0 0 6px; }
.beat-main .act { color: var(--ink-2); margin: 0; font-size: 13px; }
.beat-col h5 { margin: 0 0 4px; font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: .06em; }
.beat-col p { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
.motion-meter { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.motion-meter .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; max-width: 90px; }
.motion-meter .bar i { display: block; height: 100%; background: var(--track-motion); }
.motion-meter .num { font-size: 11px; color: var(--ink-3); }
mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

.beats.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.beats.cards .beat-row {
  display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); cursor: pointer;
}
.beats.cards .beat-row.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.beats.cards .beat-col:not(.cam) { display: none; }
.beats.cards .thumbs { max-width: none; }
.beats.cards .beat-meta { flex-direction: row; align-items: center; flex-wrap: wrap; }
.empty-note { padding: 30px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: var(--radius); }

/* ---------- generic cards ---------- */
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { padding: 16px 18px; }
.card h4 { margin: 0 0 10px; font: 600 15px/1.3 var(--serif); display: flex; align-items: center; gap: 8px; }
.card h4 .tag { font: 500 10px var(--mono); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin-left: auto; }
.card p { margin: 0 0 8px; color: var(--ink-2); }
.card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.card li { position: relative; padding-left: 16px; color: var(--ink-2); }
.card li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 1px; background: var(--accent); }
.card.feature { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: linear-gradient(160deg, var(--accent-soft), transparent 60%), var(--panel); }
.card.feature .big { font: 500 17px/1.7 var(--serif); color: var(--ink); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 14px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 12px; padding-top: 2px; }
.kv dd { margin: 0; color: var(--ink-2); }
.tagset { display: flex; flex-wrap: wrap; gap: 6px; }

.col-keep { --c: var(--good); }
.col-swap { --c: var(--fn-build); }
.col-no { --c: var(--bad); }
.transfer-col { border-top: 3px solid var(--c); }
.transfer-col h4 { color: var(--c); }
.transfer-col li::before { background: var(--c); }

.palette { display: flex; height: 54px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
.palette div { position: relative; min-width: 28px; }
.palette span { position: absolute; left: 6px; bottom: 4px; font: 10px var(--mono); color: #fff; mix-blend-mode: difference; }

.peaks { display: flex; flex-direction: column; gap: 8px; }
.peak-item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); cursor: pointer; background: var(--bg-2); }
.peak-item:hover { border-color: var(--accent); }
.peak-item .tc { color: var(--accent); font-weight: 600; }

.big-num { font: 600 42px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.big-num small { font-size: 16px; color: var(--ink-3); margin-left: 4px; }

/* ---------- prompts ---------- */
.prompt-intro { padding: 14px 18px; margin-bottom: 14px; color: var(--ink-2); font-size: 13px; white-space: pre-wrap; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button {
  border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  font-size: 14px;
}
.tabs button .k { font: 600 11px var(--mono); margin-right: 6px; padding: 2px 5px; border: 1px solid currentColor; border-radius: 3px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.prompt-blocks { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.prompt-block { display: flex; flex-direction: column; overflow: hidden; }
.prompt-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.prompt-head h4 { margin: 0; font: 600 14px var(--serif); }
.prompt-head .count { font: 11px var(--mono); color: var(--ink-3); margin-left: auto; }
.prompt-body {
  padding: 14px 16px; margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.85 var(--sans); color: var(--ink-2);
  max-height: 460px; overflow: auto;
}
.prompt-body .lead { color: var(--accent); font-weight: 600; }
.prompt-block.expanded .prompt-body { max-height: none; }
.prompt-legacy { padding: 12px 18px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; color: var(--ink-2); border-left: 3px solid var(--accent); }
.prompt-tabbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -6px 0 12px; font-size: 12px; }
.tabs button.partial { opacity: .7; }
.prompt-block.partial { border-style: dashed; }
.badge-partial { font: 600 11px var(--sans); padding: 2px 8px; border-radius: 999px; color: var(--accent); border: 1px solid currentColor; white-space: nowrap; }
.prompt-directions { padding: 14px 18px; margin-top: 14px; }
.prompt-directions h4 { margin: 0 0 8px; font: 600 14px var(--serif); }
.prompt-directions ul { margin: 0 0 8px; padding-left: 18px; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
.prompt-directions p { margin: 0; font-size: 12px; }

/* ---------- checks ---------- */
.checks { display: flex; flex-direction: column; }
.check { display: grid; grid-template-columns: 28px 160px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.check:last-child { border-bottom: 0; }
.check .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.check.pass .ico { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.check.warn .ico { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.check.fail .ico { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.check.skip .ico { background: var(--panel-2); color: var(--skip); }
.check .nm { font-weight: 600; }
.check .dt { color: var(--ink-2); }
.check .refs { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 6px; }
.check .refs button { font: 11px var(--mono); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; }
.check .refs button:hover { border-color: var(--accent); color: var(--accent); }

.foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; }

/* ---------- overlays ---------- */
.lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(8, 7, 6, .92); display: flex; align-items: center; justify-content: center; gap: 12px; }
.lightbox[hidden] { display: none; }
.lightbox figure { margin: 0; max-width: 86vw; max-height: 88vh; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lightbox img { max-height: 80vh; max-width: 86vw; object-fit: contain; border-radius: 6px; }
.lightbox figcaption { color: #ece6da; font-size: 13px; text-align: center; max-width: 720px; }
.lb-close { position: absolute; top: 16px; right: 20px; background: none; border: 0; color: #fff; font-size: 30px; cursor: pointer; }
.lb-nav { background: rgba(255, 255, 255, .08); border: 0; color: #fff; font-size: 30px; width: 44px; height: 64px; border-radius: 8px; cursor: pointer; }
.keys { position: fixed; inset: 0; z-index: 200; background: rgba(8, 7, 6, .7); display: grid; place-items: center; }
.keys[hidden] { display: none; }
.keys-card { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 22px 26px; min-width: 300px; }
.keys-card h3 { margin: 0 0 12px; font: 600 18px var(--serif); }
.keys-card dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px; margin: 0; }
.keys-card dt { font: 12px var(--mono); color: var(--accent); }
.keys-card dd { margin: 0; color: var(--ink-2); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; animation: rise .25s ease both; }
.toast[hidden] { display: none; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .beats.list .beat-row { grid-template-columns: 176px 110px minmax(0, 1fr); }
  .beats.list .beat-col { grid-column: 3; }
  .grid.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 28px; }
  .monitor, .monitor.portrait { grid-template-columns: 1fr; }
  .grid.c2, .grid.c3 { grid-template-columns: 1fr; }
  .prompt-blocks { grid-template-columns: 1fr; }
  .toc { display: none; }
  .search { width: 100%; }
  .check { grid-template-columns: 28px 1fr; }
  .check .dt { grid-column: 2; }
}
@media (max-width: 560px) {
  .page, .topbar-inner { padding-left: 14px; padding-right: 14px; }
  .beats.list .beat-row { grid-template-columns: 1fr; }
  .beats.list .beat-col { grid-column: auto; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid.c4 { grid-template-columns: 1fr; }
  .check-pill { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ---------- index page ---------- */
.idx-head { padding: 48px 0 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.idx-head h1 { font: 600 40px/1.1 var(--serif); margin: 10px 0 0; }
.idx-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 18px 0; }
.idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.case-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden; transition: transform .2s, border-color .2s; animation: rise .5s ease both; }
.case-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.case-card .cover { aspect-ratio: 3/4; background: #000 center/cover no-repeat; position: relative; }
.case-card .cover .badge { position: absolute; top: 8px; left: 8px; font: 600 10px var(--mono); padding: 3px 6px; border-radius: 3px; background: rgba(0, 0, 0, .65); color: #fff; letter-spacing: .06em; }
.case-card .cover .badge.pub { background: var(--good); color: #062; }
.case-card .cover .badge.del { background: #555; }
.case-card .cover .dur { position: absolute; bottom: 8px; right: 8px; font: 11px var(--mono); padding: 2px 6px; border-radius: 3px; background: rgba(0, 0, 0, .65); color: #fff; }
.case-card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.case-card .cid { font: 11px var(--mono); color: var(--ink-3); }

.case-card p { margin: 0; font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.case-card .foot-row { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 6px; }
.case-card.no-report { opacity: .55; }

</style>

<script>
/* Case Lab report runtime. Every number on the page is computed from DOC; nothing is baked in. */
(() => {
  'use strict';

  const DOC = JSON.parse(document.getElementById('doc').textContent);
  const A = DOC.analysis || {};
  const META = A.meta || {};
  const M = DOC.measure || null;
  const P = DOC.params || {};
  const SEGS = DOC.segments || [];
  const FRAMES = DOC.frames || {};
  const STRIP = DOC.filmstrip || [];
  const DUR = DOC.stats.duration || (M && M.probe.duration) || (SEGS.length ? SEGS[SEGS.length - 1].end : 0) || 1;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  const list = (v) => (Array.isArray(v) ? v.filter((x) => x !== '' && x != null) : v ? [v] : []);
  const fmt = (t) => {
    t = Math.max(0, Number(t) || 0);
    const m = Math.floor(t / 60);
    return `${String(m).padStart(2, '0')}:${(t - m * 60).toFixed(2).padStart(5, '0')}`;
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const FN_LABEL = { hook: '钩子', setup: '铺垫', build: '递进', twist: '转折', payoff: '兑现', ending: '收尾' };
  const fnOf = (s) => (FN_LABEL[s.narrative_function] ? s.narrative_function : 'setup');
  const PORTRAIT = M ? M.probe.height > M.probe.width : /^(9:16|3:4|4:5|2:3)$/.test(String(META.aspect_ratio || ''));
  const AR = M && M.probe.width ? `${M.probe.width}/${M.probe.height}` : PORTRAIT ? '9/16' : '16/9';
  document.documentElement.style.setProperty('--ar', AR);

  /* ---------------- small renderers ---------------- */
  const chips = (arr, cls = '') => list(arr).map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join('');
  const ul = (arr) => {
    const items = list(arr);
    return items.length ? `<ul>${items.map((x) => `<li>${val(x)}</li>`).join('')}</ul>` : '<p class="dim">—</p>';
  };
  function val(v) {
    if (v == null || v === '') return '<span class="dim">—</span>';
    if (Array.isArray(v)) return v.map(val).join('、');
    if (typeof v === 'object') {
      return Object.entries(v).map(([k, x]) => `<b>${esc(k)}</b>：${val(x)}`).join('；');
    }
    if (typeof v === 'boolean') return v ? '是' : '否';
    return esc(v);
  }
  const kv = (pairs) => {
    const rows = pairs.filter(([, v]) => list(v).length || (typeof v === 'string' && v));
    if (!rows.length) return '<p class="dim">—</p>';
    return `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${val(v)}</dd>`).join('')}</dl>`;
  };
  const card = (title, body, extra = '', tag = '') =>
    `<div class="panel card ${extra}"><h4>${esc(title)}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</h4>${body}</div>`;
  const head = (idx, title, sub = '') =>
    `<div class="block-head"><h2><span class="idx">${idx}</span>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>`;
  const fnBadge = (s) => `<span class="fn" data-fn="${fnOf(s)}">${esc(FN_LABEL[fnOf(s)])}</span>`;
  const attDots = (n) => {
    n = clamp(Math.round(Number(n) || 0), 0, 5);
    return `<span class="att" title="注意力 ${n}/5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
  };
  const toast = (msg) => {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.hidden = true; }, 1600);
  };

  function verdictOf(s) {
    if (s.motion == null) return null;
    const claim = s.camera_claim;
    if (claim === 'moving' && s.motion < P.static_max_motion && s.seconds >= 0.8)
      return { cls: 'bad', text: '声称运镜 · 实测几乎不动' };
    if (claim === 'static' && s.motion > P.busy_min_motion && s.seconds >= 0.8)
      return { cls: 'hint', text: '声称固定 · 实测偏动' };
    if (claim === 'moving') return { cls: 'ok', text: '运镜 · 实测吻合' };
    if (claim === 'static') return { cls: 'ok', text: '固定 · 实测吻合' };
    return null;
  }
  const MOTION_MAX = (() => {
    if (!M) return 20;
    const v = [...M.motion.values].sort((a, b) => a - b);
    return Math.max(15, v[Math.floor(v.length * 0.98)] || 0);
  })();

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('已复制到剪贴板');
  }

  /* ---------------- hero ---------------- */
  function renderHero() {
    const S = DOC.stats;
    const sum = A.summary || {};
    const vm = A.viral_mechanics || {};
    const probe = M ? M.probe : null;
    const metaChips = [
      probe ? `<span class="chip"><b>${probe.width}×${probe.height}</b></span>` : META.resolution ? `<span class="chip"><b>${esc(META.resolution)}</b></span>` : '',
      `<span class="chip"><b>${esc(probe ? probe.aspect : META.aspect_ratio || '?')}</b></span>`,
      probe ? `<span class="chip">${probe.fps} fps</span>` : '',
      META.primary_format ? `<span class="chip accent">${esc(META.primary_format)}</span>` : '',
      META.pace ? `<span class="chip">节奏 ${esc(META.pace)}</span>` : '',
      probe ? `<span class="chip">${probe.has_audio ? '有声 · ' + esc(probe.audio_codec) : '无声'}</span>` : '',
      DOC.video.name ? `<span class="chip dim" title="${esc(DOC.video.src)}">${esc(DOC.video.name)}${DOC.video.proxy ? ' · 720p 代理播放' : ''}</span>` : '',
    ].join('');
    const stat = (k, v, unit = '', h = '') =>
      `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v ?? '—'}${v != null && unit ? `<small>${unit}</small>` : ''}</div>${h ? `<div class="h">${esc(h)}</div>` : ''}</div>`;
    const sync = S.sync_rate != null ? Math.round(S.sync_rate * 100) : null;
    const stats = M
      ? [
          stat('片长', S.duration.toFixed(2), 's'),
          stat('实测镜头', S.shots, '镜', `分析节拍 ${S.beats}`),
          stat('平均镜长', S.avg_shot, 's', `${S.min_shot}s – ${S.max_shot}s`),
          stat('每分钟切', S.cuts_per_min, '次'),
          stat('画面运动', S.motion_avg, '', '帧间差均值'),
          stat('音画卡点', sync, sync != null ? '%' : '', `起音点 ${S.onsets} 个 · 估算`),
        ].join('')
      : [stat('片长', S.duration ? S.duration.toFixed(2) : null, 's'), stat('估计镜头', S.shots, '镜'), stat('分析节拍', S.beats, '段')].join('');
    $('#sec-hero').innerHTML = `
      <div>
        <div class="hero-kicker">${esc(DOC.case_id)} · 视频案例拆解</div>
        <h1>${esc(DOC.title)}</h1>
        ${sum.one_sentence ? `<p class="quote">${esc(sum.one_sentence)}</p>` : ''}
        <div class="meta-row">${metaChips}</div>
      </div>
      <div class="hero-side">
        <div class="stat-grid">${stats}</div>
        <div class="hero-note"><b>钩子</b>　${esc(vm.hook_type || '—')}${(A.rhythm_structure || {}).hook_window ? `<br><b>钩子窗口</b>　${esc(A.rhythm_structure.hook_window)}` : ''}${sum.core_appeal ? `<br><b>核心吸引力</b>　${esc(sum.core_appeal)}` : ''}</div>
        ${!M ? `<div class="hero-note dim">${DOC.measure_error ? '实测失败：' + esc(DOC.measure_error) : '未关联原视频：实测轨道与对账已跳过。用 <code>--video</code> 指定后重新生成。'}</div>` : ''}
      </div>`;
  }

  /* ---------------- player ---------------- */
  const video = $('#player');
  const wrap = $('#playerWrap');
  let curIdx = -1;
  let loopOn = false;
  let rafId = 0;

  function initPlayer() {
    $('#sec-monitor .monitor').classList.toggle('portrait', PORTRAIT);
    $('#tcTotal').textContent = fmt(DUR);
    if (DOC.video.src) {
      video.src = DOC.video.src;
    } else {
      wrap.classList.add('empty');
    }
    video.addEventListener('error', () => wrap.classList.add('empty'));
    video.addEventListener('loadedmetadata', () => {
      wrap.classList.remove('empty');
      if (Math.abs(video.duration - DUR) > 0.6) toast(`视频时长 ${video.duration.toFixed(2)}s 与报告 ${DUR.toFixed(2)}s 不一致`);
    });
    $('#pickVideo').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) { video.src = URL.createObjectURL(f); }
    });
    video.addEventListener('play', () => { $('#btnPlay').textContent = '❚❚'; tick(); });
    video.addEventListener('pause', () => { $('#btnPlay').textContent = '▶'; cancelAnimationFrame(rafId); sync(); });
    video.addEventListener('seeked', sync);
    video.addEventListener('timeupdate', () => { if (video.paused) sync(); });
    $('#btnPlay').addEventListener('click', togglePlay);
    $('#rate').addEventListener('change', (e) => { video.playbackRate = Number(e.target.value); });
    $('#btnLoop').addEventListener('click', toggleLoop);
    $('#btnPip').addEventListener('click', togglePip);
  }
  function togglePlay() {
    if (wrap.classList.contains('empty')) return toast('先选择本地视频');
    video.paused ? video.play() : video.pause();
  }
  function toggleLoop() {
    loopOn = !loopOn;
    $('#btnLoop').classList.toggle('on', loopOn);
    toast(loopOn ? '循环当前节拍' : '已关闭循环');
    drawOverlay();
  }
  async function togglePip() {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    } catch { toast('当前浏览器不支持画中画'); }
  }
  function tick() {
    sync();
    if (!video.paused) rafId = requestAnimationFrame(tick);
  }
  function seek(t, play = false) {
    t = clamp(t, 0, DUR);
    if (!wrap.classList.contains('empty')) {
      video.currentTime = t;
      if (play) video.play();
    }
    syncAt(t);
  }
  function beatAt(t) {
    let lo = 0, hi = SEGS.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (SEGS[mid].start <= t + 1e-3) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }
  function sync() { syncAt(video.currentTime || 0); }
  function syncAt(t) {
    if (loopOn && curIdx >= 0 && !video.paused) {
      const s = SEGS[curIdx];
      if (t >= s.end - 0.03 || t < s.start - 0.1) { video.currentTime = s.start; t = s.start; }
    }
    $('#tcNow').textContent = fmt(t);
    const idx = beatAt(t);
    if (idx !== curIdx) setBeat(idx);
    if (curIdx >= 0) {
      const s = SEGS[curIdx];
      const bar = $('#inspProg');
      if (bar) bar.style.width = `${clamp((t - s.start) / Math.max(0.01, s.seconds) * 100, 0, 100)}%`;
    }
    playheadT = t;
    drawOverlay();
  }
  function setBeat(idx) {
    curIdx = idx;
    renderInspector();
    $$('.beat-row').forEach((r) => r.classList.toggle('on', r.dataset.idx === String(idx)));
    $$('#tracksCanvas .beat').forEach((r) => r.classList.toggle('on', r.dataset.idx === String(idx)));
  }
  function stepBeat(d) {
    if (!SEGS.length) return;
    const i = clamp((curIdx < 0 ? 0 : curIdx) + d, 0, SEGS.length - 1);
    seek(SEGS[i].start + 0.001);
  }

  /* ---------------- inspector ---------------- */
  function renderInspector() {
    const el = $('#inspector');
    el.classList.add('panel');
    const s = SEGS[curIdx];
    if (!s) {
      el.innerHTML = `<p class="dim">${SEGS.length ? '播放或点击轨道查看节拍' : 'analysis.json 没有 timeline'}</p>`;
      return;
    }
    const v = verdictOf(s);
    el.innerHTML = `
      <div class="insp-top">
        <div><div class="insp-id">${esc(s.id)}</div><div class="insp-time">${fmt(s.start)} → ${fmt(s.end)} · ${s.seconds.toFixed(2)}s</div></div>
        <div style="text-align:right">${fnBadge(s)}<div style="margin-top:6px">${attDots(s.attention_level)}</div></div>
      </div>
      <div class="insp-progress"><i id="inspProg"></i></div>
      <p class="insp-event">${esc(s.visual_event)}</p>
      <dl class="insp-dl">
        ${s.subject_action ? `<dt>动作</dt><dd>${esc(s.subject_action)}</dd>` : ''}
        ${s.camera_action ? `<dt>运镜</dt><dd>${esc(s.camera_action)}${v ? ` <span class="verdict ${v.cls}">${v.text}</span>` : ''}</dd>` : ''}
        ${s.motion != null ? `<dt>实测</dt><dd class="num">运动 ${s.motion} · 响度 ${s.loudness ?? '—'} dB${s.cuts_inside ? ` · 内含 ${s.cuts_inside} 个切点` : ''}</dd>` : ''}
        ${s.audio_event ? `<dt>声音</dt><dd>${esc(s.audio_event)}</dd>` : ''}
        ${s.lighting_description ? `<dt>光线</dt><dd>${esc(s.lighting_description)}</dd>` : ''}
        ${s.transition_detail ? `<dt>转场</dt><dd>${esc(s.transition_detail)}</dd>` : ''}
      </dl>
      <div class="insp-nav">
        <button class="btn" data-step="-1">← 上一拍</button>
        <button class="btn" data-replay>⟲ 重播此拍</button>
        <button class="btn" data-step="1">下一拍 →</button>
      </div>`;
    el.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => stepBeat(Number(b.dataset.step))));
    el.querySelector('[data-replay]').addEventListener('click', () => seek(s.start + 0.001, true));
  }

  /* ---------------- tracks ---------------- */
  const canvas = $('#tracksCanvas');
  let geo = null;
  let playheadT = 0;
  let hoverT = null;

  function lanes() {
    const L = [{ key: 'axis', h: 18 }];
    if (list(A.rhythm_structure?.peak_moments).length) L.push({ key: 'peaks', h: 16, label: '峰值' });
    if (M) L.push({ key: 'shots', h: 22, label: '实测镜头' });
    L.push({ key: 'beats', h: 26, label: '分析节拍' });
    L.push({ key: 'att', h: 38, label: '注意力' });
    if (M && M.motion.values.length) L.push({ key: 'motion', h: 42, label: '画面运动' });
    if (M && M.audio.values.length) L.push({ key: 'audio', h: 42, label: '音频响度' });
    if (M && M.brightness.values.length) L.push({ key: 'bright', h: 24, label: '亮度' });
    return L;
  }

  function renderTracks() {
    const legend = [
      M ? '<span><i style="background:var(--ink-2)"></i>场景检测切点</span><span><i style="background:var(--good)"></i>卡在起音点上的切点</span>' : '',
      ...Object.keys(FN_LABEL).filter((k) => SEGS.some((s) => fnOf(s) === k)).map((k) => `<span><i style="background:var(--fn-${k})"></i>${FN_LABEL[k]}</span>`),
      M ? '<span><i style="background:var(--track-motion)"></i>运动</span><span><i style="background:var(--track-audio)"></i>响度 / 起音</span>' : '',
    ].join('');
    $('#tracksLegend').innerHTML = legend;
    $('#tracks').classList.add('panel');
    drawTracks();
    new ResizeObserver(() => drawTracks()).observe(canvas);

    let dragging = false;
    const tAt = (e) => {
      const r = canvas.getBoundingClientRect();
      return clamp(((e.clientX - r.left) - geo.x0) / (geo.x1 - geo.x0) * DUR, 0, DUR);
    };
    canvas.addEventListener('pointerdown', (e) => {
      const peak = e.target.closest('[data-peak]');
      if (peak) return seek(Number(peak.dataset.peak));
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      seek(tAt(e));
    });
    canvas.addEventListener('pointermove', (e) => {
      hoverT = tAt(e);
      if (dragging) seek(hoverT);
      showTip(e, hoverT);
      drawOverlay();
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointerleave', () => { hoverT = null; $('#scrubTip').hidden = true; drawOverlay(); });
  }

  function areaPath(values, hz, x, yOf, base) {
    if (!values.length) return '';
    const n = values.length;
    const px = Math.max(1, Math.floor(geo.x1 - geo.x0));
    const step = Math.max(1, Math.floor(n / px));
    let d = `M${x(0).toFixed(1)},${base}`;
    for (let i = 0; i < n; i += step) {
      let v = values[i];
      for (let j = i + 1; j < Math.min(n, i + step); j++) v = Math.max(v, values[j]);
      d += `L${x(i / hz).toFixed(1)},${yOf(v).toFixed(1)}`;
    }
    d += `L${x((n - 1) / hz).toFixed(1)},${base}Z`;
    return d;
  }
  function linePath(values, hz, x, yOf) {
    const n = values.length;
    const step = Math.max(1, Math.floor(n / Math.max(1, geo.x1 - geo.x0)));
    let d = '';
    for (let i = 0; i < n; i += step) d += `${d ? 'L' : 'M'}${x(i / hz).toFixed(1)},${yOf(values[i]).toFixed(1)}`;
    return d;
  }

  function drawTracks() {
    const W = canvas.clientWidth || 800;
    const LS = lanes();
    const gap = 6;
    const x0 = 72, x1 = W - 6;
    const x = (t) => x0 + (t / DUR) * (x1 - x0);
    let y = 0;
    LS.forEach((l) => { l.y = y; y += l.h + gap; });
    const H = y;
    geo = { W, H, x0, x1, x, lanes: LS };
    const out = [];
    const lane = (k) => LS.find((l) => l.key === k);

    // ticks
    const ax = lane('axis');
    const rough = DUR / 6;
    const steps = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
    const st = steps.find((s) => s >= rough) || 600;
    const ticks = [];
    for (let t = 0; t < DUR - st * 0.4; t += st) ticks.push(t);
    ticks.push(DUR);
    ticks.forEach((t, i) => {
      const last = i === ticks.length - 1;
      out.push(`<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${ax.h - 4}" y2="${H}"/>`);
      out.push(`<text class="axis" x="${x(t) + (last ? -3 : 3)}" y="${ax.h - 7}" text-anchor="${last ? 'end' : 'start'}">${last ? fmt(t) : fmt(t).replace(/\.\d+$/, '')}</text>`);
    });
    LS.forEach((l) => {
      if (!l.label) return;
      out.push(`<rect class="lane" x="${x0}" y="${l.y}" width="${x1 - x0}" height="${l.h}" rx="3"/>`);
      out.push(`<text class="lbl" x="0" y="${l.y + l.h / 2 + 4}">${l.label}</text>`);
    });

    const pk = lane('peaks');
    if (pk) {
      list(A.rhythm_structure.peak_moments).forEach((p) => {
        const t = Number(p.time) || 0, cx = x(t), cy = pk.y + pk.h / 2;
        out.push(`<path class="peak" data-peak="${t}" d="M${cx},${cy - 6}L${cx + 6},${cy}L${cx},${cy + 6}L${cx - 6},${cy}Z"><title>${esc(fmt(t))} ${esc(p.reason)}</title></path>`);
      });
    }

    const sh = lane('shots');
    if (sh) {
      const hits = new Set((M.sync.hits || []).map(String));
      M.shots.forEach((s, i) => {
        out.push(`<rect class="shot ${i % 2 ? 'alt' : ''}" x="${x(s.start)}" y="${sh.y}" width="${Math.max(1, x(s.end) - x(s.start))}" height="${sh.h}" rx="2"><title>${s.id} ${fmt(s.start)}–${fmt(s.end)} · ${s.seconds}s · 运动 ${s.motion ?? '—'}</title></rect>`);
        if (i > 0) out.push(`<line class="cut ${hits.has(String(s.start)) ? 'sync' : ''}" x1="${x(s.start)}" x2="${x(s.start)}" y1="${sh.y - 2}" y2="${sh.y + sh.h + 2}"/>`);
      });
    }

    const bt = lane('beats');
    SEGS.forEach((s, i) => {
      const w = Math.max(1, x(s.end) - x(s.start));
      out.push(`<rect class="beat ${i === curIdx ? 'on' : ''}" data-idx="${i}" x="${x(s.start) + 0.5}" y="${bt.y}" width="${w - 1}" height="${bt.h}" rx="3" fill="var(--fn-${fnOf(s)})"><title>${esc(s.id)} ${esc(FN_LABEL[fnOf(s)])} · ${esc(s.visual_event)}</title></rect>`);
      if (w > 28) out.push(`<text class="beat-t" x="${x(s.start) + 5}" y="${bt.y + bt.h / 2 + 4}">${esc(s.id)}</text>`);
    });

    const at = lane('att');
    if (SEGS.length) {
      const yOf = (v) => at.y + at.h - 3 - (clamp(Number(v) || 0, 0, 5) / 5) * (at.h - 6);
      let d = `M${x(SEGS[0].start)},${at.y + at.h}`;
      SEGS.forEach((s) => { d += `L${x(s.start)},${yOf(s.attention_level)}L${x(s.end)},${yOf(s.attention_level)}`; });
      d += `L${x(SEGS[SEGS.length - 1].end)},${at.y + at.h}Z`;
      out.push(`<path class="curve-att" d="${d}"/>`);
    }

    const mo = lane('motion');
    if (mo) {
      const yOf = (v) => mo.y + mo.h - (clamp(v, 0, MOTION_MAX) / MOTION_MAX) * (mo.h - 3);
      out.push(`<path class="curve-motion" d="${areaPath(M.motion.values, M.motion.hz, x, yOf, mo.y + mo.h)}"/>`);
      const sy = yOf(P.static_max_motion);
      out.push(`<line class="grid" x1="${x0}" x2="${x1}" y1="${sy}" y2="${sy}" stroke-dasharray="2 3"><title>静止阈值 ${P.static_max_motion}</title></line>`);
    }

    const au = lane('audio');
    if (au) {
      const yOf = (v) => au.y + au.h - (clamp((v + 60) / 60, 0, 1)) * (au.h - 3);
      out.push(`<path class="curve-audio" d="${areaPath(M.audio.values, M.audio.hz, x, yOf, au.y + au.h)}"/>`);
      (M.onsets || []).forEach((t) => out.push(`<line class="onset" x1="${x(t)}" x2="${x(t)}" y1="${au.y}" y2="${au.y + 6}"/>`));
    }

    const br = lane('bright');
    if (br) {
      const yOf = (v) => br.y + br.h - (clamp(v, 0, 255) / 255) * (br.h - 2);
      out.push(`<path class="curve-bright" d="${linePath(M.brightness.values, M.brightness.hz, x, yOf)}"/>`);
    }

    canvas.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${out.join('')}<g id="overlay"></g></svg>`;
    drawOverlay();
  }

  function drawOverlay() {
    const g = $('#overlay');
    if (!g || !geo) return;
    const { x, H } = geo;
    let s = '';
    if (loopOn && SEGS[curIdx]) {
      const b = SEGS[curIdx];
      s += `<rect class="loop" x="${x(b.start)}" y="14" width="${x(b.end) - x(b.start)}" height="${H - 14}"/>`;
    }
    if (hoverT != null) s += `<line class="hoverline" x1="${x(hoverT)}" x2="${x(hoverT)}" y1="0" y2="${H}"/>`;
    s += `<line class="playhead" x1="${x(playheadT)}" x2="${x(playheadT)}" y1="0" y2="${H}"/>`;
    s += `<circle cx="${x(playheadT)}" cy="3" r="4" fill="var(--accent)"/>`;
    g.innerHTML = s;
  }

  function nearestStrip(t) {
    if (!STRIP.length) return null;
    let best = STRIP[0];
    for (const f of STRIP) if (Math.abs(f.t - t) < Math.abs(best.t - t)) best = f;
    return best;
  }
  function showTip(e, t) {
    const tip = $('#scrubTip');
    const f = nearestStrip(t);
    const idx = beatAt(t);
    const s = SEGS[idx];
    const at = (track) => (track && track.values.length ? track.values[clamp(Math.round(t * track.hz), 0, track.values.length - 1)] : null);
    tip.innerHTML = `
      ${f ? `<img src="${f.src}" alt="">` : ''}
      <div class="tt">${fmt(t)}${s ? ` · ${esc(s.id)}` : ''}</div>
      ${s ? `<div class="row"><span>${esc(FN_LABEL[fnOf(s)])}</span><b>注意力 ${esc(s.attention_level ?? '—')}</b></div>` : ''}
      ${M ? `<div class="row"><span>运动</span><b>${at(M.motion) ?? '—'}</b></div><div class="row"><span>响度</span><b>${at(M.audio) ?? '—'} dB</b></div>` : ''}`;
    tip.hidden = false;
    const r = $('#tracks').getBoundingClientRect();
    const left = clamp(e.clientX - r.left + 14, 8, r.width - 200);
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(8, e.clientY - r.top - tip.offsetHeight - 12)}px`;
  }

  /* ---------------- beats table ---------------- */
  let view = 'list';
  let fnFilter = 'all';
  let query = '';
  let lbItems = [];
  let lbIdx = 0;

  function renderBeatFilters() {
    const counts = {};
    SEGS.forEach((s) => { counts[fnOf(s)] = (counts[fnOf(s)] || 0) + 1; });
    const btn = (k, label, n) => `<button data-fn="${k}" class="${fnFilter === k ? 'on' : ''}">${esc(label)}<span class="n">${n}</span></button>`;
    $('#fnFilter').innerHTML = btn('all', '全部', SEGS.length)
      + Object.keys(FN_LABEL).filter((k) => counts[k]).map((k) => btn(k, FN_LABEL[k], counts[k])).join('');
    $$('#fnFilter button').forEach((b) => b.addEventListener('click', () => { fnFilter = b.dataset.fn; renderBeatFilters(); renderBeats(); }));
  }
  const hl = (text) => {
    const e = esc(text);
    if (!query) return e;
    const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return e.replace(new RegExp(q, 'gi'), (m) => `<mark>${m}</mark>`);
  };
  function renderBeats() {
    const box = $('#beats');
    box.className = `beats ${view}`;
    const q = query.toLowerCase();
    const rows = SEGS.map((s, i) => ({ s, i })).filter(({ s }) => {
      if (fnFilter !== 'all' && fnOf(s) !== fnFilter) return false;
      if (!q) return true;
      return [s.id, s.visual_event, s.subject_action, s.camera_action, s.audio_event, s.subject_description, s.environment_description]
        .some((v) => String(v || '').toLowerCase().includes(q));
    });
    lbItems = [];
    if (!rows.length) { box.innerHTML = '<div class="empty-note">没有匹配的节拍</div>'; return; }
    box.innerHTML = rows.map(({ s, i }) => {
      const fr = FRAMES[s.id] || {};
      const thumb = (tag, label) => {
        if (!fr[tag]) return tag === 'a' ? '<div class="none">无帧</div>' : '';
        lbItems.push({ src: fr[tag], cap: `${s.id}${tag} · ${label} · ${s.visual_event || ''}` });
        return `<figure data-lb="${lbItems.length - 1}"><img loading="lazy" src="${fr[tag]}" alt=""><figcaption>${s.id}${tag}</figcaption></figure>`;
      };
      const v = verdictOf(s);
      const pct = s.motion != null ? clamp(s.motion / MOTION_MAX * 100, 2, 100) : 0;
      return `
      <article class="beat-row ${i === curIdx ? 'on' : ''}" data-idx="${i}" id="${esc(s.id)}">
        <div class="thumbs ${PORTRAIT ? 'portrait' : ''}">${thumb('a', '起')}${thumb('b', '收')}</div>
        <div class="beat-meta">
          <span class="bid">${esc(s.id)}</span>
          <span class="bt">${fmt(s.start)}<br>${s.seconds.toFixed(2)}s</span>
          <span>${fnBadge(s)}</span>
          ${attDots(s.attention_level)}
        </div>
        <div class="beat-main">
          <p class="ev">${hl(s.visual_event)}</p>
          <p class="act">${hl(s.subject_action)}</p>
        </div>
        <div class="beat-col cam">
          <h5>运镜</h5>
          ${s.motion != null ? `<div class="motion-meter"><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${s.motion}</span>${v ? `<span class="verdict ${v.cls}">${v.text}</span>` : ''}</div>` : ''}
          <p>${hl(s.camera_action)}</p>
        </div>
        <div class="beat-col">
          <h5>声音</h5><p>${hl(s.audio_event || '—')}</p>
          ${s.transition_type ? `<h5>转场</h5><p>${esc(s.transition_type)}</p>` : ''}
        </div>
      </article>`;
    }).join('');
    $$('.beat-row', box).forEach((r) => r.addEventListener('click', (e) => {
      const fig = e.target.closest('[data-lb]');
      if (fig) return openLb(Number(fig.dataset.lb));
      seek(SEGS[Number(r.dataset.idx)].start + 0.001);
      $('#sec-monitor').scrollIntoView({ block: 'start' });
    }));
  }
  function initBeats() {
    renderBeatFilters();
    renderBeats();
    $('#search').addEventListener('input', (e) => { query = e.target.value.trim(); renderBeats(); });
    $$('#viewToggle button').forEach((b) => b.addEventListener('click', () => {
      view = b.dataset.view;
      $$('#viewToggle button').forEach((x) => x.classList.toggle('on', x === b));
      renderBeats();
    }));
  }

  /* ---------------- lightbox ---------------- */
  function openLb(i) {
    if (!lbItems.length) return;
    lbIdx = (i + lbItems.length) % lbItems.length;
    $('#lbImg').src = lbItems[lbIdx].src;
    $('#lbCap').textContent = lbItems[lbIdx].cap;
    $('#lightbox').hidden = false;
  }
  const closeLb = () => { $('#lightbox').hidden = true; };
  $('#lbClose').addEventListener('click', closeLb);
  $('#lbPrev').addEventListener('click', () => openLb(lbIdx - 1));
  $('#lbNext').addEventListener('click', () => openLb(lbIdx + 1));
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLb(); });

  /* ---------------- analysis sections ---------------- */
  function renderWhy() {
    const E = A.emotion_and_psychology || {};
    const V = A.viral_mechanics || {};
    const S = A.summary || {};
    $('#sec-why').innerHTML = head('03', '为什么抓人', '模型判断 · 机制层') + `
      <div class="grid c3">
        ${card('核心吸引力', `<p class="big">${esc(S.core_appeal || '—')}</p>${S.likely_intent ? `<p class="dim">意图：${esc(S.likely_intent)}</p>` : ''}`, 'feature', 'appeal')}
        ${card('情绪', kv([['主导情绪', E.dominant_emotion], ['情绪曲线', E.emotion_curve]]), '', 'emotion')}
        ${card('钩子', kv([['类型', V.hook_type], ['窗口', A.rhythm_structure?.hook_window]]), '', 'hook')}
      </div>
      <div class="grid c4" style="margin-top:14px">
        ${card('观众为什么停下', ul(E.viewer_pull_factors), '', 'pull')}
        ${card('为什么看完', ul(V.retention_drivers), '', 'retention')}
        ${card('为什么转发', ul(V.shareability_drivers), '', 'share')}
        ${card('为什么复看', ul(V.repeat_watch_drivers), '', 'repeat')}
      </div>
      ${list(E.why_it_feels_premium).length ? `<div class="grid" style="margin-top:14px">${card('高级感从哪来', ul(E.why_it_feels_premium), '', 'premium')}</div>` : ''}`;
  }

  function renderVisual() {
    const VL = A.visual_language || {};
    const pal = M && M.palette && M.palette.length
      ? `<div class="palette">${M.palette.map((c) => `<div style="background:${esc(c.hex)};flex:${c.pct}" title="${esc(c.hex)} · ${Math.round(c.pct * 100)}%"><span>${esc(c.hex)}</span></div>`).join('')}</div>`
      : '<p class="dim">无实测色板（需要原视频）</p>';
    const chars = list(A.characters_detected);
    const CHAR_KEYS = {
      brief_description: '简述', distinguishing_features: '辨识特征', state_changes: '状态变化',
      appearance_count: '出场次数', first_seen_at: '首次出现', last_seen_at: '最后出现', role: '角色',
      gender: '性别', age_range: '年龄', outfit: '服装', hairstyle: '发型', makeup: '妆容',
    };
    const charKv = (c) => kv(Object.entries(c).filter(([k]) => !['name', 'id'].includes(k))
      .map(([k, v]) => [CHAR_KEYS[k] || k, /seen_at$/.test(k) && typeof v === 'number' ? `${v}s` : v]));
    $('#sec-visual').innerHTML = head('04', '视觉语言') + `
      <div class="grid c2">
        ${card('色板', `${pal}<p style="margin-top:12px" class="dim">实测（像素聚类）↑　　模型描述 ↓</p><div class="tagset">${chips(VL.palette)}</div>`, '', 'palette')}
        ${card('风格关键词', `<div class="tagset">${chips(VL.style_keywords, 'accent')}</div>${VL.global_style_direction ? `<p style="margin-top:12px">${esc(VL.global_style_direction)}</p>` : ''}`, '', 'style')}
      </div>
      <div class="grid c2" style="margin-top:14px">
        ${card('质感与成像', kv([['真实度', VL.realism_level], ['制作观感', VL.production_look], ['设备感', VL.camera_equipment_feel], ['皮肤', VL.skin_texture], ['质感特效', VL.texture_fx]]), '', 'look')}
        ${card('光线与环境', kv([['光线', VL.lighting], ['环境', VL.environment_traits], ['主体设计', VL.subject_design_traits]]), '', 'light')}
      </div>
      ${chars.length ? `<div class="grid c${Math.min(3, chars.length)}" style="margin-top:14px">${chars.map((c, i) => card(c.name || c.id || `角色 ${i + 1}`, typeof c === 'object' ? charKv(c) : `<p>${esc(c)}</p>`, '', 'character')).join('')}</div>` : ''}`;
  }

  function renderCamera() {
    const C = A.camera_language || {};
    const R = A.rhythm_structure || {};
    const AV = A.audio_visual_sync || {};
    const S = DOC.stats;
    const peaks = list(R.peak_moments);
    const sync = S.sync_rate != null ? Math.round(S.sync_rate * 100) : null;
    $('#sec-camera').innerHTML = head('05', '镜头 · 节奏 · 音画') + `
      <div class="grid c3">
        ${card('镜头语言', kv([['主导运镜', C.dominant_movement], ['景别', C.shot_types], ['运动模式', C.movement_patterns], ['构图', C.framing_traits], ['连续性', C.continuity_strategy || C.movement_continuity]]), '', 'camera')}
        ${card('节奏结构', kv([['模式', R.pattern], ['强度曲线', R.intensity_curve]]) + (peaks.length ? `<h4 style="margin-top:14px">峰值时刻</h4><div class="peaks">${peaks.map((p) => `<div class="peak-item" data-seek="${Number(p.time) || 0}"><span class="tc">${fmt(p.time)}</span><span>${esc(p.reason)}</span></div>`).join('')}</div>` : ''), '', 'rhythm')}
        ${card('音画关系', (M ? `<div style="display:flex;gap:22px;align-items:flex-end;margin-bottom:12px"><div><div class="big-num">${sync ?? '—'}<small>${sync != null ? '%' : ''}</small></div><div class="dim" style="font-size:12px">切点落在起音点 ±${P.sync_tolerance}s</div></div><div><div class="big-num" style="font-size:28px">${S.onsets}</div><div class="dim" style="font-size:12px">起音点（估算）</div></div></div>` : '') + kv([['音乐类型', AV.music_genre], ['节拍对画面', AV.beat_impact_on_visuals], ['人物律动', AV.character_rhythm_sync], ['推荐 BGM', AV.recommended_bgm_reference || AV.recommended_bgm_style], ['BPM', AV.recommended_bpm], ['卡点方案', AV.music_sync_plan]]), '', 'a/v')}
      </div>`;
    $$('#sec-camera [data-seek]').forEach((el) => el.addEventListener('click', () => { seek(Number(el.dataset.seek)); $('#sec-monitor').scrollIntoView(); }));
  }

  function renderTransfer() {
    const T = A.transferable_pattern || {};
    $('#sec-transfer').innerHTML = head('06', '可迁移骨架', '换角色、换题材之后仍然成立的结构') + `
      ${T.abstract_pattern ? `<div class="panel card feature" style="margin-bottom:14px"><h4>抽象骨架<span class="tag">pattern</span></h4><p class="big">${esc(T.abstract_pattern)}</p></div>` : ''}
      <div class="grid c3">
        ${card('必须保留', ul(T.must_keep), 'transfer-col col-keep', 'keep')}
        ${card('可以替换', ul(T.replaceable), 'transfer-col col-swap', 'swap')}
        ${card('不要照抄', ul(T.do_not_copy_literally), 'transfer-col col-no', 'avoid')}
      </div>`;
  }

  function renderSeedance() {
    const S = A.seedance_translation || {};
    const N = A.next_step_assets || {};
    const variants = list(N.variants);
    $('#sec-seedance').innerHTML = head('07', 'Seedance 转译') + `
      <div class="grid c2">
        ${card('推荐生成方式', `<p><span class="chip accent">${esc(S.recommended_mode || '—')}</span>${S.shot_plan_needed != null ? ` <span class="chip">${S.shot_plan_needed ? '需要分镜计划' : '无需分镜计划'}</span>` : ''}</p><p>${esc(S.why || '')}</p><h4 style="margin-top:12px">参考素材</h4>${ul(S.reference_asset_suggestion)}`, '', 'mode')}
        ${card('翻车风险', ul(S.risk_points), 'transfer-col col-no', 'risk')}
      </div>
      ${S.seedance_ready_prompt_template ? `<div class="panel prompt-block" style="margin-top:14px"><div class="prompt-head"><h4>提示词模板（分析阶段）</h4><span class="count">${String(S.seedance_ready_prompt_template).length} 字</span><button class="btn" data-copy-tpl>复制</button></div><pre class="prompt-body">${esc(S.seedance_ready_prompt_template)}</pre></div>` : ''}
      ${variants.length ? `<div class="grid c${Math.min(3, variants.length)}" style="margin-top:14px">${variants.map((v) => card(v.name || '变体', `<p>${esc(v.direction || '')}</p>${kv([['改变', v.what_changes], ['保留', v.what_stays]])}`, '', 'variant')).join('')}</div>` : ''}`;
    const b = $('[data-copy-tpl]');
    if (b) b.addEventListener('click', () => copyText(S.seedance_ready_prompt_template));
  }

  let promptTab = 0;
  function renderPrompts() {
    const PR = DOC.prompts;
    const sec = $('#sec-prompts');
    if (!PR || !PR.versions || !PR.versions.length) {
      sec.innerHTML = head('08', '生成 Prompt') + '<div class="empty-note">这个 case 还没有 prompts.md</div>';
      return;
    }
    const TS = /\[?\d+(?:\.\d+)?\s*[-–~至到]\s*\d+(?:\.\d+)?\s*(?:秒|s|S)\]?/g;
    const fmtBody = (t) => esc(t)
      .replace(/^(\s*)(Shot\s*\d+\s*[|｜:：]|[^\s：:\n\d][^\s：:\n]{0,9}：)/gm, '$1<span class="lead">$2</span>')
      .replace(TS, (m) => `<mark title="违反「禁止时间戳」契约">${m}</mark>`);
    const v = PR.versions[promptTab] || PR.versions[0];
    const full = v.blocks.filter((b) => !b.partial);
    const legacyNote = PR.legacy ? `
      <div class="panel prompt-legacy">这个 case 早于 A/B/C 版本规范，Prompt 从旧文件（${esc(PR.source)}）原样整理：每张卡片都是可直接粘贴的完整文本；
        变体页已自动带上共用的人物参考图 Prompt。标「局部片段」的卡片只是替换段，需要和完整版合并后再用。</div>` : '';
    const directions = PR.directions && PR.directions.length ? `
      <div class="panel prompt-directions"><h4>变体方向 · 只有思路，没有完整 Prompt</h4>
        <ul>${PR.directions.map((d) => `<li><b>${esc(d.title)}</b>${d.text ? ` — ${esc(d.text)}` : ''}</li>`).join('')}</ul>
        <p class="dim">需要的话用 shot_prompt_generator.py 重新生成 prompts.md，会产出完整的 A/B/C 版本。</p></div>` : '';
    sec.innerHTML = head('08', '生成 Prompt', `来自 ${PR.source} · 每段可单独复制粘贴`) + legacyNote + `
      ${PR.intro ? `<div class="panel prompt-intro">${esc(PR.intro)}</div>` : ''}
      <div class="tabs">${PR.versions.map((x, i) => `<button data-tab="${i}" class="${i === promptTab ? 'on' : ''}${x.partial ? ' partial' : ''}"><span class="k">${i + 1}</span>${esc(x.title)}</button>`).join('')}</div>
      <div class="prompt-tabbar">
        <span class="dim">${v.source ? `出自 ${esc(v.source)} · ` : ''}${v.updated_at ? `最近更新 ${esc(v.updated_at)} · ` : ''}${v.blocks.length} 段${v.blocks.length - full.length ? `（含 ${v.blocks.length - full.length} 段局部片段）` : ''}</span>
        ${full.length > 1 ? '<button class="btn ghost" data-copy-all>复制本版全部</button>' : ''}
      </div>
      <div class="prompt-blocks">${v.blocks.map((b, i) => `
        <div class="panel prompt-block${b.partial ? ' partial' : ''}">
          <div class="prompt-head"><h4>${esc(b.title || '正文')}</h4>${b.partial ? '<span class="badge-partial" title="只替换完整版中的一部分，不能单独使用">局部片段 · 需与完整版合并</span>' : ''}<span class="count">${b.updated_at ? `更新于 ${esc(b.updated_at)} · ` : ''}${b.body.length} 字</span>
            <button class="btn ghost" data-expand="${i}">展开</button><button class="btn primary" data-copy="${i}">复制</button></div>
          <pre class="prompt-body">${fmtBody(b.body)}</pre>
        </div>`).join('')}</div>${directions}`;
    $$('[data-tab]', sec).forEach((b) => b.addEventListener('click', () => { promptTab = Number(b.dataset.tab); renderPrompts(); }));
    $$('[data-copy]', sec).forEach((b) => b.addEventListener('click', () => copyText(v.blocks[Number(b.dataset.copy)].body)));
    $('[data-copy-all]', sec)?.addEventListener('click', () => copyText(full.map((b) => `【${b.title}】\n${b.body}`).join('\n\n')));
    $$('[data-expand]', sec).forEach((b) => b.addEventListener('click', () => {
      const blk = b.closest('.prompt-block');
      blk.classList.toggle('expanded');
      b.textContent = blk.classList.contains('expanded') ? '收起' : '展开';
    }));
  }

  function renderChecks() {
    const C = DOC.checks || [];
    const n = (s) => C.filter((c) => c.status === s).length;
    const ICON = { pass: '✓', warn: '!', fail: '×', skip: '–' };
    const idxOf = (id) => SEGS.findIndex((s) => s.id === id);
    $('#sec-checks').innerHTML = head('09', '质量对账', '模型声称 vs 代码实测 · 跳过不等于通过') + `
      <div class="panel checks">${C.map((c) => `
        <div class="check ${c.status}">
          <span class="ico">${ICON[c.status]}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="dt">${esc(c.detail)}${c.refs.length ? `<span class="refs">${c.refs.map((r) => `<button data-ref="${esc(r)}">${esc(r)}</button>`).join('')}</span>` : ''}</span>
        </div>`).join('')}</div>
      <p class="dim" style="font-size:12px;margin-top:10px">阈值：场景切点 ${M ? M.params.scene_threshold : P.scene_threshold} · 静止 &lt; ${P.static_max_motion} · 偏动 &gt; ${P.busy_min_motion} · 起音 +${P.onset_rise_db} dB · 卡点容差 ±${P.sync_tolerance}s。起音点与卡点率是基于响度曲线的估算。</p>`;
    $$('#sec-checks [data-ref]').forEach((b) => b.addEventListener('click', () => {
      const i = idxOf(b.dataset.ref);
      if (i >= 0) { seek(SEGS[i].start + 0.001); $(`#${CSS.escape(b.dataset.ref)}`)?.scrollIntoView({ block: 'center' }); }
    }));
    const pill = $('#checkPill');
    pill.innerHTML = `<b class="ok">${n('pass')}</b> 通过${n('warn') ? ` · <b class="w">${n('warn')}</b> 提示` : ''}${n('fail') ? ` · <b class="f">${n('fail')}</b> 未过` : ''}${n('skip') ? ` · ${n('skip')} 跳过` : ''}`;
    pill.addEventListener('click', () => $('#sec-checks').scrollIntoView());
  }

  function renderFoot() {
    $('#foot').innerHTML = `
      <span>生成于 ${esc(DOC.generated_at)} · ${esc(DOC.case_id)}</span>
      <span>切点、时长、运动、响度、色板由 ffmpeg 实测；节拍、机制与判断来自 analysis.json</span>`;
  }

  /* ---------------- toc / theme / export / keys ---------------- */
  function initToc() {
    const items = [['sec-hero', '概览'], ['sec-monitor', '监看台'], ['sec-beats', '节拍'], ['sec-why', '机制'], ['sec-visual', '视觉'],
      ['sec-camera', '节奏'], ['sec-transfer', '迁移'], ['sec-seedance', 'Seedance'], ['sec-prompts', 'Prompt'], ['sec-checks', '对账']];
    $('#toc').innerHTML = items.map(([id, l]) => `<a href="#${id}" data-id="${id}">${l}</a>`).join('');
    const io = new IntersectionObserver((ents) => {
      ents.forEach((e) => {
        if (e.isIntersecting) $$('#toc a').forEach((a) => a.classList.toggle('on', a.dataset.id === e.target.id));
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    items.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
  }
  function initTheme() {
    const saved = localStorage.getItem('vca-theme');
    if (saved) document.documentElement.dataset.theme = saved;
    $('#btnTheme').addEventListener('click', toggleTheme);
  }
  function toggleTheme() {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('vca-theme', next);
  }
  function initExport() {
    $('#btnExport').addEventListener('click', () => {
      const { frames, filmstrip, ...rest } = DOC;
      const blob = new Blob([JSON.stringify(rest, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${DOC.case_id}_report.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  }
  function initKeys() {
    $('#btnKeys').addEventListener('click', () => { $('#keys').hidden = false; });
    $('#keys').addEventListener('click', () => { $('#keys').hidden = true; });
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
      if (e.key === 'Escape') {
        closeLb(); $('#keys').hidden = true;
        if (typing) document.activeElement.blur();
        return;
      }
      if (typing) return;
      if (!$('#lightbox').hidden) {
        if (e.key === 'ArrowLeft') openLb(lbIdx - 1);
        if (e.key === 'ArrowRight') openLb(lbIdx + 1);
        return;
      }
      const fps = (M && M.probe.fps) || 30;
      const k = e.key;
      const now = video.currentTime || playheadT;
      if (k === ' ') { e.preventDefault(); togglePlay(); }
      else if (k === 'ArrowLeft') { e.preventDefault(); stepBeat(-1); }
      else if (k === 'ArrowRight') { e.preventDefault(); stepBeat(1); }
      else if (k === 'j' || k === 'J') seek(now - 1);
      else if (k === 'l' || k === 'L') seek(now + 1);
      else if (k === ',') { video.pause(); seek(now - 1 / fps); }
      else if (k === '.') { video.pause(); seek(now + 1 / fps); }
      else if (k === 'r' || k === 'R') toggleLoop();
      else if (k === 'p' || k === 'P') togglePip();
      else if (k === 't' || k === 'T') toggleTheme();
      else if (k === '/') { e.preventDefault(); $('#search').focus(); }
      else if (k === '?') $('#keys').hidden = false;
      else if (/^[1-9]$/.test(k) && DOC.prompts && DOC.prompts.versions[Number(k) - 1]) { promptTab = Number(k) - 1; renderPrompts(); }
    });
  }

  /* ---------------- boot ---------------- */
  renderHero();
  initPlayer();
  renderTracks();
  initBeats();
  renderWhy();
  renderVisual();
  renderCamera();
  renderTransfer();
  renderSeedance();
  renderPrompts();
  renderChecks();
  renderFoot();
  initToc();
  initTheme();
  initExport();
  initKeys();
  setBeat(SEGS.length ? 0 : -1);
  if (location.hash) {
    const i = SEGS.findIndex((s) => `#${s.id}` === location.hash);
    if (i >= 0) seek(SEGS[i].start + 0.001);
  }
})();

</script>
